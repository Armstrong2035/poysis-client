  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  --obsidian: #0A0B0F;\n  --dark-surface: #14161D;\n  --dark-surface-2: #1A1D26;\n  --mid-gray: #3A3D47;\n  --mid-gray-soft: rgba(58, 61, 71, 0.4);\n  --light-gray: #9CA0AC;\n  --bone: #E8E9ED;\n  --forge: #E8A547;\n  --forge-dim: rgba(232, 165, 71, 0.35);\n  --forge-soft: rgba(232, 165, 71, 0.08);\n  --confidence: #4ADE80;\n  --crimson: #E5484D;\n  --shell-blur: saturate(140%) blur(14px);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  background: var(--obsidian);\n  color: var(--bone);\n  font-family: 'DM Sans', sans-serif;\n  font-weight: 300;\n  -webkit-font-smoothing: antialiased;\n  scroll-behavior: smooth;\n}\n\nbody {\n  overflow-x: hidden;\n  position: relative;\n}\n\n::selection { background: var(--forge); color: var(--obsidian); }\n\n/* =========================================\n   Background canvas + overlays\n   ========================================= */\n#bgCanvas {\n  position: fixed;\n  inset: 0;\n  width: 100vw;\n  height: 100vh;\n  z-index: 0;\n  pointer-events: none;\n}\n\n.scanlines {\n  position: fixed;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background-image: repeating-linear-gradient(\n    to bottom,\n    rgba(255,255,255,0.018) 0,\n    rgba(255,255,255,0.018) 1px,\n    transparent 1px,\n    transparent 3px\n  );\n  mix-blend-mode: overlay;\n}\n\n.grid-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 1;\n  pointer-events: none;\n  background-image:\n    linear-gradient(to right, rgba(232,165,71,0.025) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(232,165,71,0.025) 1px, transparent 1px);\n  background-size: 48px 48px;\n  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);\n}\n\n/* =========================================\n   Film strips (top + bottom, fixed)\n   ========================================= */\n.filmstrip {\n  position: fixed;\n  left: 0; right: 0;\n  height: 22px;\n  background: #050608;\n  z-index: 50;\n  display: flex;\n  align-items: center;\n  overflow: hidden;\n  border-color: rgba(58,61,71,0.5);\n  border-style: solid;\n  border-width: 0;\n}\n.filmstrip--top    { top: 0;    border-bottom-width: 1px; }\n.filmstrip--bottom { bottom: 0; border-top-width: 1px; }\n\n.filmstrip__track {\n  display: flex;\n  gap: 8px;\n  padding: 0 4px;\n  flex: 1;\n}\n.sprocket {\n  width: 9px;\n  height: 11px;\n  background: var(--obsidian);\n  border-radius: 1.5px;\n  flex: 0 0 auto;\n}\n\n/* =========================================\n   HUD bars\n   ========================================= */\n.hud {\n  position: fixed;\n  left: 0; right: 0;\n  z-index: 40;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 24px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--light-gray);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n}\n.hud--top {\n  top: 22px;\n  height: 48px;\n  background: rgba(10,11,15,0.85);\n  backdrop-filter: var(--shell-blur);\n  -webkit-backdrop-filter: var(--shell-blur);\n  border-bottom: 1px solid rgba(58,61,71,0.25);\n}\n.hud--bottom {\n  bottom: 22px;\n  height: 36px;\n  background: rgba(10,11,15,0.7);\n  backdrop-filter: var(--shell-blur);\n  -webkit-backdrop-filter: var(--shell-blur);\n  border-top: 1px solid rgba(58,61,71,0.2);\n  font-size: 9px;\n}\n\n.wordmark {\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n  color: var(--bone);\n  text-transform: none;\n  display: inline-flex;\n  align-items: baseline;\n  gap: 1px;\n}\n.wordmark__dot {\n  color: var(--forge);\n  font-size: 10px;\n  transform: translateY(-6px);\n  display: inline-block;\n}\n\n.hud__right { display: flex; align-items: center; gap: 14px; }\n.hud__tag { color: var(--light-gray); opacity: 0.7; }\n.hud__status {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  color: var(--bone);\n}\n.status-dot {\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--confidence);\n  box-shadow: 0 0 8px var(--confidence);\n  animation: pulse-soft 2.4s ease-in-out infinite;\n}\n\n.hud__center {\n  position: absolute;\n  left: 50%;\n  transform: translateX(-50%);\n}\n.coord-flicker { display: inline-block; min-width: 4ch; }\n\n/* =========================================\n   Registration marks (corner crosshairs)\n   ========================================= */\n.regmarks { position: absolute; inset: 0; pointer-events: none; z-index: 5; }\n.regmark {\n  position: absolute;\n  width: 18px; height: 18px;\n  opacity: 0.45;\n}\n.regmark::before, .regmark::after {\n  content: '';\n  position: absolute;\n  background: var(--mid-gray);\n}\n.regmark::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }\n.regmark::after  { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }\n.regmark--tl { top: 96px; left: 32px; }\n.regmark--tr { top: 96px; right: 32px; }\n.regmark--bl { bottom: 76px; left: 32px; }\n.regmark--br { bottom: 76px; right: 32px; }\n\n/* =========================================\n   Scene scaffold\n   ========================================= */\n.scene {\n  position: relative;\n  min-height: 100vh;\n  width: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 120px 64px 100px;\n  z-index: 3;\n}\n.scene__inner {\n  width: 100%;\n  max-width: 1280px;\n  position: relative;\n  z-index: 4;\n}\n\n/* shared text */\n.eyebrow {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--forge);\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  opacity: 0.85;\n}\n.eyebrow--dim {\n  color: var(--light-gray);\n  opacity: 0.55;\n}\n.mission-brief {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--mid-gray);\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n}\n\n.h-display {\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: clamp(38px, 5.4vw, 72px);\n  line-height: 1.04;\n  letter-spacing: -0.025em;\n  color: var(--bone);\n  text-wrap: balance;\n}\n.h-display--amber { color: var(--forge); }\n\n.h-medium {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: clamp(28px, 3.2vw, 44px);\n  line-height: 1.08;\n  letter-spacing: -0.02em;\n  color: var(--bone);\n}\n.h-medium--amber { color: var(--forge); }\n\n.h-section {\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: clamp(28px, 2.6vw, 36px);\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n  color: var(--bone);\n}\n\n.body-md {\n  font-family: 'DM Sans', sans-serif;\n  font-weight: 300;\n  font-size: 15px;\n  line-height: 1.6;\n  color: var(--light-gray);\n}\n.body-sm {\n  font-family: 'DM Sans', sans-serif;\n  font-weight: 300;\n  font-size: 13px;\n  line-height: 1.6;\n  color: var(--light-gray);\n  opacity: 0.85;\n}\n.body-italic {\n  font-style: italic;\n  color: var(--light-gray);\n}\n\n/* =========================================\n   Reveal animations (Intersection Observer)\n   ========================================= */\n.reveal {\n  opacity: 0;\n  transform: translateY(14px);\n  transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),\n              transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);\n}\n.reveal.active { opacity: 1; transform: translateY(0); }\n\n.reveal-left  { transform: translateX(-30px); }\n.reveal-left.active { transform: translateX(0); }\n.reveal-right { transform: translateX(30px); }\n.reveal-right.active { transform: translateX(0); }\n\n/* stagger */\n.reveal[data-delay=\"1\"] { transition-delay: 0.10s; }\n.reveal[data-delay=\"2\"] { transition-delay: 0.30s; }\n.reveal[data-delay=\"3\"] { transition-delay: 0.55s; }\n.reveal[data-delay=\"4\"] { transition-delay: 0.85s; }\n.reveal[data-delay=\"5\"] { transition-delay: 1.15s; }\n.reveal[data-delay=\"6\"] { transition-delay: 1.45s; }\n\n@keyframes fade-up {\n  from { opacity: 0; transform: translateY(12px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes fade-in {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\n@keyframes pulse-soft {\n  0%, 100% { opacity: 0.6; transform: scale(1); }\n  50%      { opacity: 1;   transform: scale(1.04); }\n}\n@keyframes float-y {\n  0%, 100% { transform: translateY(0); }\n  50%      { transform: translateY(-6px); }\n}\n@keyframes amber-pulse-once {\n  0%   { text-shadow: 0 0 0 transparent; }\n  40%  { text-shadow: 0 0 28px rgba(232,165,71,0.55); }\n  100% { text-shadow: 0 0 12px rgba(232,165,71,0.18); }\n}\n\n/* =========================================\n   Scene 1 — The Hook\n   ========================================= */\n.scene--hook .scene__inner {\n  text-align: left;\n  display: flex;\n  flex-direction: column;\n  gap: 28px;\n  max-width: 1100px;\n}\n.scene--hook .mission-brief { margin-bottom: 12px; }\n.scroll-prompt {\n  position: absolute;\n  bottom: 88px;\n  left: 50%;\n  transform: translateX(-50%);\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--forge);\n  opacity: 0.6;\n  letter-spacing: 0.28em;\n  animation: float-y 2.6s ease-in-out infinite;\n  z-index: 5;\n}\n\n/* =========================================\n   Scene 2 — The Wound\n   ========================================= */\n.scene--wound .scene__inner {\n  display: flex;\n  flex-direction: column;\n  gap: 28px;\n  max-width: 1000px;\n}\n.scene--wound .body-md { max-width: 540px; }\n\n/* Scene 1 + 2 debris field — DOM-rendered floating tokens */\n.debris-field {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  z-index: 2;\n  overflow: hidden;\n}\n.debris-item {\n  position: absolute;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--light-gray);\n  opacity: 0.18;\n  letter-spacing: 0.05em;\n  white-space: nowrap;\n  user-select: none;\n  text-transform: lowercase;\n  animation: drift var(--dur, 60s) linear infinite;\n}\n.debris-item--lg {\n  font-size: 13px;\n  opacity: 0.32;\n}\n@keyframes drift {\n  0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)); }\n  50%  { transform: translate(var(--dx, 40px), var(--dy, -30px)) rotate(var(--rot, 0deg)); }\n  100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }\n}\n\n/* =========================================\n   Scene 3a — The Reveal\n   ========================================= */\n.scene--reveal { text-align: center; }\n.scene--reveal .scene__inner {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 24px;\n  max-width: 820px;\n}\n.reveal-headline {\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: clamp(56px, 8vw, 96px);\n  color: var(--forge);\n  letter-spacing: -0.03em;\n  line-height: 0.95;\n  animation: amber-pulse-once 2.2s ease-out forwards;\n}\n.station-glow {\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  pointer-events: none;\n  background: radial-gradient(circle at 50% 50%,\n    rgba(232,165,71,0.10) 0%,\n    rgba(232,165,71,0.04) 22%,\n    transparent 55%);\n}\n.station-cluster {\n  position: absolute;\n  top: 50%; left: 50%;\n  transform: translate(-50%, -50%);\n  z-index: 1;\n  width: min(720px, 70vw);\n  height: min(720px, 70vw);\n  opacity: 0.18;\n  pointer-events: none;\n}\n\n/* =========================================\n   Scene 3b/c/d — Product scenes (50/50)\n   ========================================= */\n.scene--product {\n  padding: 120px 64px 120px;\n}\n.scene--product .scene__inner {\n  display: grid;\n  grid-template-columns: 42% 1fr;\n  gap: 56px;\n  align-items: center;\n}\n.product-copy {\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  max-width: 460px;\n}\n.product-copy .h-medium { margin: 4px 0 4px; }\n.product-copy .body-sm { line-height: 1.65; }\n\n.chips-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-top: 6px;\n}\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  height: 26px;\n  padding: 0 12px;\n  border: 1px solid var(--mid-gray-soft);\n  background: rgba(20, 22, 29, 0.5);\n  border-radius: 2px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--light-gray);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  transition: border-color 0.2s, color 0.2s;\n}\n.chip--live {\n  color: var(--bone);\n  border-color: var(--forge-dim);\n  background: var(--forge-soft);\n}\n.chip--live::before {\n  content: '';\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: var(--confidence);\n  box-shadow: 0 0 6px var(--confidence);\n}\n.chip--more { color: var(--mid-gray); }\n\n/* Product window */\n.product-window {\n  position: relative;\n  width: 100%;\n  aspect-ratio: 4 / 3;\n  background: linear-gradient(180deg, #0d0f15 0%, #0a0b0f 100%);\n  border: 1px solid rgba(58, 61, 71, 0.5);\n  overflow: hidden;\n}\n.product-window__label {\n  position: absolute;\n  top: 14px; left: 18px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9.5px;\n  color: var(--forge);\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  opacity: 0.8;\n  z-index: 5;\n}\n.product-window__status {\n  position: absolute;\n  top: 14px; right: 18px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9.5px;\n  color: var(--light-gray);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  opacity: 0.6;\n  z-index: 5;\n}\n.product-window__vignette {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  z-index: 4;\n  background:\n    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%),\n    repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);\n}\n.product-window__bracket {\n  position: absolute;\n  width: 18px; height: 18px;\n  border: 1px solid var(--forge);\n  z-index: 3;\n}\n.product-window__bracket--tl { top: 8px;    left: 8px;    border-right: none; border-bottom: none; }\n.product-window__bracket--tr { top: 8px;    right: 8px;   border-left:  none; border-bottom: none; }\n.product-window__bracket--bl { bottom: 8px; left: 8px;    border-right: none; border-top:    none; }\n.product-window__bracket--br { bottom: 8px; right: 8px;   border-left:  none; border-top:    none; }\n\n/* placeholder content (until poysis-mvp is dropped in) */\n.product-window__placeholder {\n  position: absolute;\n  inset: 44px 22px 28px;\n  z-index: 2;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n/* ----- Placeholder: Connect ----- */\n.ph-connect {\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  padding: 8px 4px;\n}\n.ph-connect__crumb {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--mid-gray);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n.ph-connect__title {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 22px;\n  color: var(--bone);\n  letter-spacing: -0.02em;\n}\n.ph-connect__sub {\n  font-family: 'DM Sans', sans-serif;\n  font-size: 12px;\n  color: var(--light-gray);\n  max-width: 340px;\n  line-height: 1.5;\n}\n.ph-bigbtn {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  padding: 18px 22px;\n  border: 1px solid var(--forge);\n  background:\n    radial-gradient(ellipse at left, rgba(232,165,71,0.18) 0%, transparent 60%),\n    rgba(20,22,29,0.7);\n  cursor: default;\n  margin-top: 4px;\n}\n.ph-bigbtn__icon {\n  width: 28px; height: 28px;\n  border: 1px solid var(--forge-dim);\n  display: grid; place-items: center;\n  color: var(--forge);\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: 14px;\n}\n.ph-bigbtn__txt {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 14px;\n  color: var(--bone);\n  letter-spacing: -0.01em;\n}\n.ph-bigbtn__meta {\n  margin-left: auto;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--forge);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n.ph-soon {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-top: 4px;\n}\n.ph-input-line {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  border: 1px dashed var(--mid-gray);\n  padding: 10px 12px;\n  margin-top: 4px;\n}\n.ph-input-line__placeholder {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--mid-gray);\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n.ph-input-line__btn {\n  margin-left: auto;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--forge);\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n}\n.ph-promise {\n  margin-top: 6px;\n  font-family: 'DM Sans', sans-serif;\n  font-style: italic;\n  font-size: 11px;\n  color: var(--light-gray);\n  opacity: 0.7;\n}\n\n/* ----- Placeholder: Map / Query ----- */\n.ph-map {\n  position: absolute;\n  inset: 44px 22px 28px;\n  display: flex;\n  flex-direction: column;\n}\n.ph-map__canvas {\n  position: relative;\n  flex: 1;\n  overflow: hidden;\n}\n.ph-cluster {\n  position: absolute;\n  border-radius: 50%;\n  border: 1px solid var(--mid-gray);\n  display: grid; place-items: center;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--light-gray);\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  text-align: center;\n  padding: 6px;\n  background: rgba(20,22,29,0.6);\n  opacity: 0.45;\n}\n.ph-cluster--focus {\n  border: 1px solid var(--forge);\n  background:\n    radial-gradient(circle, rgba(232,165,71,0.22) 0%, rgba(232,165,71,0.06) 70%),\n    rgba(20,22,29,0.8);\n  color: var(--bone);\n  opacity: 1;\n  box-shadow: 0 0 22px rgba(232,165,71,0.25);\n}\n.ph-cluster__count {\n  display: block;\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: 16px;\n  color: var(--bone);\n  letter-spacing: -0.01em;\n  margin-bottom: 2px;\n  text-transform: none;\n}\n.ph-cluster--focus .ph-cluster__count { color: var(--forge); }\n.ph-focus-brackets {\n  position: absolute;\n  width: 8px; height: 8px;\n  border: 1px solid var(--forge);\n}\n.ph-focus-brackets--tl { border-right: none; border-bottom: none; }\n.ph-focus-brackets--tr { border-left:  none; border-bottom: none; }\n.ph-focus-brackets--bl { border-right: none; border-top:    none; }\n.ph-focus-brackets--br { border-left:  none; border-top:    none; }\n\n.ph-scope {\n  position: absolute;\n  top: 8px; left: 8px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--forge);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  opacity: 0.85;\n}\n.ph-confidence {\n  position: absolute;\n  top: 8px; right: 8px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--confidence);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n\n.ph-cmd {\n  margin-top: 12px;\n  border: 1px solid var(--forge-dim);\n  background: rgba(20,22,29,0.85);\n  padding: 12px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n.ph-cmd__label {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--forge);\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  opacity: 0.7;\n}\n.ph-cmd__q {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 15px;\n  color: var(--bone);\n  letter-spacing: -0.01em;\n}\n.ph-cmd__caret {\n  display: inline-block;\n  width: 8px; height: 14px;\n  background: var(--forge);\n  vertical-align: -2px;\n  margin-left: 4px;\n  animation: caret-blink 1s steps(2) infinite;\n}\n@keyframes caret-blink {\n  to { background: transparent; }\n}\n\n/* ----- Placeholder: Build ----- */\n.ph-build {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  padding: 4px 2px 0;\n}\n.ph-build__head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 4px;\n}\n.ph-build__title {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 14px;\n  color: var(--bone);\n  letter-spacing: -0.01em;\n}\n.ph-build__meta {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9px;\n  color: var(--forge);\n  letter-spacing: 0.18em;\n  text-transf acity: 0.6; cursor: wait; }\n\n.waitlist-error {\n  color: var(--crimson);\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  min-height: 16px;\n}\n.form-meta {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9.5px;\n  color: var(--mid-gray);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n}\n.success-state {\n  display: none;\n  text-align: center;\n  margin-top: 8px;\n}\n.success-state.visible { display: block; animation: fade-up 0.6s ease both; }\n.success-state__main {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 22px;\n  color: var(--confidence);\n  letter-spacing: -0.01em;\n}\n.success-state__sub {\n  font-family: 'DM Sans', sans-serif;\n  font-size: 13px;\n  color: var(--light-gray);\n  margin-top: 6px;\n}\n\n/* =========================================\n   Pricing\n   ========================================= */\n.pricing {\n  margin-top: 88px;\n  width: 100%;\n  max-width: 1200px;\n}\n.pricing__head {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 24px;\n  border-bottom: 1px solid var(--mid-gray-soft);\n  padding-bottom: 16px;\n  margin-bottom: 20px;\n  text-align: left;\n}\n.pricing__title {\n  font-family: 'Syne', sans-serif;\n  font-weight: 800;\n  font-size: 22px;\n  letter-spacing: -0.02em;\n  color: var(--bone);\n}\n.pricing__grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 14px;\n}\n.tier {\n  border: 1px solid var(--mid-gray-soft);\n  background: rgba(20, 22, 29, 0.5);\n  padding: 20px 18px 22px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  position: relative;\n}\n.tier--featured {\n  border-color: var(--forge);\n  background:\n    linear-gradient(180deg, rgba(232,165,71,0.05) 0%, transparent 60%),\n    rgba(20, 22, 29, 0.7);\n}\n.tier__flag {\n  position: absolute;\n  top: -1px; right: -1px;\n  background: var(--forge);\n  color: var(--obsidian);\n ======================================================== -->\n<section class=\"scene scene--airlock\" id=\"scene-airlock\">\n  <div class=\"regmarks\" aria-hidden=\"true\">\n    <span class=\"regmark regmark--tl\"><\u002Fspan>\n    <span class=\"regmark regmark--tr\"><\u002Fspan>\n    <span class=\"regmark regmark--bl\"><\u002Fspan>\n    <span class=\"regmark regmark--br\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"scene__inner\">\n    <p class=\"closing-arg reveal\" data-delay=\"1\">\n      Thousands of documents. Years of decisions.<br>\n      Conversations that shaped your thinking.<br>\n      All of it is yours. Poysis makes it feel like it.\n    <\u002Fp>\n\n    <h2 class=\"airlock-headline reveal\" data-delay=\"2\">\n      Your knowledge is already there.<br>\n      Now <em>make it work<\u002Fem>.\n    <\u002Fh2>\n\n    <p class=\"subhead reveal\" data-delay=\"3\">\n      Join the waitlist. Be first to map your work.\n    <\u002Fp>\n\n    <div id=\"waitlist-wrap\" class=\"reveal\" data-delay=\"4\" style=\"width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;\">\n      <form id=\"waitlist-form\" class=\"waitlist\" autocomplete=\"off\">\n        <input type=\"email\" name=\"email\" class=\"waitlist__input\" placeholder=\"you@somewhere.com\" aria-label=\"Email\" required=\"\">\n        <button type=\"submit\" class=\"waitlist__btn\">\n          Request early access →\n        <\u002Fbutton>\n      <\u002Fform>\n      <div id=\"waitlist-error\" class=\"waitlist-error\" role=\"alert\"><\u002Fdiv>\n      <p class=\"form-meta\">\n        Starting with Google Drive · Free to start · No credit card required\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"waitlist-success\" class=\"success-state\">\n      <div class=\"success-state__main\">Your map is waiting.<\u002Fdiv>\n      <div class=\"success-state__sub\">We'll reach out when it's ready.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Pricing -->\n    <div class=\"pricing reveal\" data-delay er__per\">/mo<\u002Fspan><\u002Fdiv>\n          <ul class=\"tier__list\">\n            <li>Unlimited docs<\u002Fli>\n            <li>Full history<\u002Fli>\n            <li>All sources + Gmail<\u002Fli>\n            <li>+ Team sharing<\u002Fli>\n            <li>Named copilots + RBAC<\u002Fli>\n            <li>Dedicated support<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Trust -->\n    <div class=\"trust reveal\" data-delay=\"1\">\n      <div class=\"trust__head\">\n        <div class=\"trust__title\">Trust<\u002Fdiv>\n        <div class=\"eyebrow eyebrow--dim\">Security · Compliance<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"trust__grid\">\n        <div class=\"trust__item trust__item--ok\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">Encryption in transit and at rest<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trust__item trust__item--ok\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">Google OAuth with minimal scopes (drive.readonly)<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trust__item trust__item--ok\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">Permissions inheritance — if you can't open it in Drive, neither can Poysis<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trust__item trust__item--ok\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">You control what gets indexed<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trust__item trust__item--prog\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">SOC 2 Type 1 — In progress<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trust__item trust__item--prog\">\n          <span class=\"trust__mark\"><\u002Fspan>\n          <span class=\"trust__item-text\">GDPR compliance — In progress<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"trust__statement\">\n        We don't index your conversations. We capture only what you confirm worth keeping.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================================================================\n     Build film-strip sprockets dynamically (cheap loop)\n     ================================================================= -->\n<script>\n  (function () {\n    const N = Math.ceil(window.innerWidth / 17);\n    ['filmstrip-top', 'filmstrip-bottom'].forEach((id) => {\n      const el = document.getElementById(id);\n      if (!el) return;\n      let html = '';\n      for (let i = 0; i < N + 6; i++) html += '<span class=\"sprocket\"><\u002Fspan>';\n      el.innerHTML = html;\n    });\n    window.addEventListener('resize', () => {\n      const n = Math.ceil(window.innerWidth / 17);\n      ['filmstrip-top', 'filmstrip-bottom'].forEach((id) => {\n        const el = document.getElementById(id);\n        if (!el) return;\n        const have = el.children.length;\n        if (Math.abs(have - n) < 4) return;\n        let html = '';\n        for (let i = 0; i < n + 6; i++) html += '<span class=\"sprocket\"><\u002Fspan>';\n        el.innerHTML = html;\n      });\n    });\n  })();\n<\u002Fscript>\n\n<script src=\"4dfc0b95-6e17-423b-8b75-386c0d27280b\"><\u002Fscript>\n<script src=\"22274d86-db4c-4774-8a4a-b166f1b3de38\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
