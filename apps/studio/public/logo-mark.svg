<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Poysis">
  <defs>
    <radialGradient id="grad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#F5CE80"/>
      <stop offset="100%" stop-color="#E8A547"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- outer ring -->
  <circle cx="12" cy="12" r="8.5" stroke="#E8A547" stroke-width="0.8" opacity="0.22"/>
  <!-- mid ring -->
  <circle cx="12" cy="12" r="5.5" stroke="#E8A547" stroke-width="0.6" opacity="0.18"/>
  <!-- core dot -->
  <circle cx="12" cy="12" r="4" fill="url(#grad)" filter="url(#glow)"/>
</svg>
